<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 年会抽奖系统 · 纯HTML</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    color: #fff;
    text-align: center;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    overscroll-behavior: none;
    padding: 20px 20px 15px;
}

#particleCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
}

h1 {
    position: relative;
    z-index: 1;
    font-size: 2.8em;
    margin-bottom: 3px;
    flex-shrink: 0;
    text-shadow: 0 0 30px rgba(102, 126, 234, 0.6), 0 4px 15px rgba(0, 0, 0, 0.3);
    letter-spacing: 4px;
    animation: fadeInDown 0.8s ease;
    transition: font-size 0.3s ease;
    background: linear-gradient(90deg, #f093fb, #f5576c, #ffeb3b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.subtitle {
    position: relative;
    z-index: 1;
    font-size: 1em;
    opacity: 0.7;
    margin-bottom: 8px;
    flex-shrink: 0;
    animation: fadeInUp 0.8s ease 0.2s both;
}

.fullscreen-hint {
    position: fixed;
    bottom: 12px;
    right: 16px;
    z-index: 100;
    font-size: 11px;
    opacity: 0.3;
    color: #fff;
    pointer-events: none;
    transition: opacity 0.3s;
}

#setupPanel {
    position: relative;
    z-index: 1;
    flex-shrink: 0;
    padding: 6px 0 4px;
    animation: slideInUp 0.6s ease;
}

.prize-row {
    max-width: 520px;
    margin: 0 auto 8px;
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
}

.prize-row input {
    flex: 1;
    margin: 0;
    font-size: 16px;
    padding: 14px 18px;
    text-align: center;
    border-radius: 14px;
}

.draw-count-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 4px 8px;
    flex-shrink: 0;
}

.draw-count-wrap label {
    font-size: 13px;
    opacity: 0.7;
}

.draw-count-btn {
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 18px;
    font-weight: 700;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin: 0;
    text-transform: none;
    letter-spacing: 0;
}

.draw-count-btn:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: none;
    box-shadow: none;
}

#drawCount {
    width: 40px;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    padding: 4px;
    margin: 0;
    border: none;
    background: transparent;
    color: #ffeb3b;
    -moz-appearance: textfield;
}

#drawCount::-webkit-inner-spin-button,
#drawCount::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

#nameBox {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    padding: 12px 18px;
    border-radius: 16px;
    max-width: 520px;
    margin: 0 auto;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    transition: all 0.3s ease;
}

#nameBox:hover {
    border-color: rgba(255, 255, 255, 0.2);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
}

#nameBox h3 {
    font-size: 1em;
    margin-bottom: 8px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
}

.name-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
}

.name-input-row input {
    flex: 1;
    margin: 0;
}

.name-input-row button {
    margin: 0;
    white-space: nowrap;
}

#nameList {
    max-height: 130px;
    overflow-y: auto;
    overflow-x: hidden;
}

.action-row {
    text-align: center;
    margin-top: 8px;
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
}

.action-row button {
    font-size: 12px;
    padding: 7px 16px;
    margin: 0;
}

input {
    width: 90%;
    padding: 10px 14px;
    margin: 6px auto;
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    font-size: 13px;
    font-family: inherit;
    transition: all 0.3s ease;
    display: block;
}

input::placeholder {
    color: rgba(255, 255, 255, 0.5);
}

input:focus {
    outline: none;
    border-color: rgba(255, 255, 255, 0.5);
    background: rgba(255, 255, 255, 0.18);
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
}

textarea {
    width: 100%;
    padding: 14px;
    margin: 0 0 12px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    min-height: 180px;
    transition: all 0.3s ease;
    display: block;
    line-height: 1.6;
}

textarea::placeholder {
    color: rgba(255, 255, 255, 0.4);
}

textarea:focus {
    outline: none;
    border-color: rgba(255, 255, 255, 0.5);
    background: rgba(255, 255, 255, 0.16);
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
}

button {
    padding: 10px 20px;
    margin: 6px 4px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.3s ease;
    white-space: nowrap;
    background: linear-gradient(135deg, #f093fb, #f5576c);
    color: #fff;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
}

button:active {
    transform: translateY(0);
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none !important;
}

.list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    margin: 5px 0;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    border-left: 3px solid #f093fb;
    transition: all 0.3s ease;
    animation: slideInLeft 0.4s ease;
}

.list-item:hover {
    background: rgba(255, 255, 255, 0.15);
    transform: translateX(5px);
}

.list-item span:first-child {
    flex: 1;
    text-align: left;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.del {
    cursor: pointer;
    opacity: 0.5;
    font-size: 1.2em;
    transition: all 0.3s ease;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
}

.del:hover {
    opacity: 1;
    background: rgba(255, 255, 255, 0.25);
    transform: rotate(90deg) scale(1.1);
}

#display {
    position: relative;
    z-index: 1;
    flex: 1;
    min-height: 0;
    margin: 8px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0;
    perspective: 1200px;
}

#displayContent {
    position: relative;
    z-index: 2;
    font-size: 56px;
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    color: #fff;
    min-width: 300px;
    max-width: 90vw;
    text-align: center;
    transition: none;
    will-change: transform, filter, text-shadow, color;
}

#winnerBoard {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 15;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-start;
    padding: 60px 0 60px 16px;
    overflow-y: auto;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
    scrollbar-width: none;
}

#winnerBoard::-webkit-scrollbar { display: none; }

#winnerBoard.show {
    opacity: 1;
    pointer-events: auto;
}

.wb-row {
    font-size: 20px;
    font-weight: 700;
    color: #ffeb3b;
    text-shadow: 0 0 6px rgba(255,215,0,0.25);
    text-align: left;
    line-height: 1.6;
    animation: wbIn 0.2s ease forwards;
    opacity: 0;
}

@keyframes wbIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
}

body.drawing #displayContent {
    z-index: 30;
}

.wb-row {
    color: #ffeb3b;
    text-shadow: 0 0 15px rgba(255,215,0,0.5);
    animation: scaleIn 0.4s ease forwards;
}

@keyframes shuffleGlow {
    0% { text-shadow: 0 0 20px rgba(255,215,0,0.3), 0 8px 30px rgba(0,0,0,0.5); }
    100% { text-shadow: 0 0 50px rgba(255,215,0,0.8), 0 0 80px rgba(255,215,0,0.3), 0 8px 30px rgba(0,0,0,0.5); }
}

#currentPrize {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    font-size: 20px;
    font-weight: 700;
    color: #ffeb3b;
    padding: 5px 24px;
    border-radius: 30px;
    border: 1px solid rgba(255, 235, 59, 0.2);
    text-shadow: 0 0 20px rgba(255, 235, 59, 0.5);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
    white-space: nowrap;
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(4px);
}

#currentPrize.show {
    opacity: 1;
}

#displayContent.roll-mode {
    overflow: hidden;
    position: relative;
}

.roll-strip {
    display: flex;
    flex-direction: column;
    align-items: center;
    will-change: transform;
}

.roll-item {
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 900;
    flex-shrink: 0;
    color: rgba(255, 255, 255, 0.8);
    text-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
}

.roll-indicator {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 36px;
    z-index: 10;
    pointer-events: none;
    color: #ffd700;
    text-shadow: 0 0 20px rgba(255,215,0,0.8), 0 0 40px rgba(255,215,0,0.4);
    animation: indicatorPulse 0.6s ease-in-out infinite;
    line-height: 1;
}

.roll-item-winner {
    color: #ffd700 !important;
    text-shadow: 0 0 30px rgba(255,215,0,0.8), 0 0 80px rgba(255,215,0,0.4) !important;
    transform: scale(1.25);
    transition: transform 0.4s ease, color 0.4s ease, text-shadow 0.4s ease;
}


#displayBg {
    position: absolute;
    width: 500px;
    height: 150px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 30px;
    background: radial-gradient(circle at 30% 30%, rgba(255, 235, 59, 0.3), rgba(102, 126, 234, 0.15), transparent 70%);
    filter: blur(40px);
    z-index: -1;
    animation: bgPulse 0.6s ease-in-out;
    pointer-events: none;
}

#displayGlow1 {
    position: absolute;
    width: 550px;
    height: 170px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1px solid rgba(240, 147, 251, 0.2);
    box-shadow: 0 0 40px rgba(102, 126, 234, 0.3), inset 0 0 40px rgba(240, 147, 251, 0.1);
    animation: glowRotate 4s linear infinite;
    z-index: -1;
    pointer-events: none;
}

#displayGlow2 {
    position: absolute;
    width: 600px;
    height: 200px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1px solid rgba(245, 87, 108, 0.15);
    box-shadow: 0 0 60px rgba(240, 147, 251, 0.15);
    animation: glowRotate 6s linear infinite reverse;
    z-index: -2;
    pointer-events: none;
}

@keyframes bgPulse {
    0% { filter: blur(20px); opacity: 0.5; }
    50% { filter: blur(50px); opacity: 1; }
    100% { filter: blur(30px); opacity: 0.8; }
}

@keyframes glowRotate {
    0% { transform: translate(-50%, -50%) rotateZ(0deg); opacity: 0.5; }
    50% { opacity: 1; }
    100% { transform: translate(-50%, -50%) rotateZ(360deg); opacity: 0.5; }
}

.button-group {
    position: relative;
    z-index: 1;
    text-align: center;
    flex-shrink: 0;
    padding: 8px 0 12px;
    animation: slideInUp 0.8s ease 0.2s both;
}

#drawBtn {
    padding: 18px 64px;
    font-size: 22px;
    min-width: 240px;
    background: linear-gradient(135deg, #667eea, #764ba2) !important;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
    animation: drawBtnPulse 2s ease-in-out infinite;
    position: relative;
    overflow: hidden;
}

#drawBtn::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.1), transparent 60%);
    animation: drawBtnShine 3s ease-in-out infinite;
}

@keyframes drawBtnPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 12px 35px rgba(0,0,0,0.3); }
    50% { transform: scale(1.03); box-shadow: 0 18px 50px rgba(102,126,234,0.5); }
}

@keyframes drawBtnShine {
    0%, 100% { transform: rotate(0deg); opacity: 0.5; }
    50% { transform: rotate(180deg); opacity: 1; }
}

body.drawing #drawBtn {
    animation: none;
}

body.drawing #drawBtn::after {
    display: none;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
}

@keyframes slideInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes scaleIn {
    from { opacity: 0; transform: scale(0.3); }
    to { opacity: 1; transform: scale(1); }
}

body.drawing #setupPanel {
    display: none !important;
}

body.drawing h1 {
    font-size: 1.5em;
    margin-bottom: 2px;
    opacity: 0.6;
}

body.drawing .subtitle {
    display: none;
}

body.drawing #display {
    flex: 1;
    height: auto;
    margin: 4px auto;
}

body.drawing #displayContent.roll-mode {
    height: 420px;
}

body.drawing .roll-item {
    height: 68px;
    font-size: 34px;
}

body.drawing .button-group {
    flex-shrink: 0;
    padding: 4px 0 8px;
}

body.drawing #displayBg {
    width: 750px;
    height: 320px;
    animation: bgPulse 0.4s ease-in-out infinite alternate;
}

body.drawing #displayGlow1 {
    width: 800px;
    height: 300px;
    animation: glowRotate 3s linear infinite;
}

body.drawing #displayGlow2 {
    width: 880px;
    height: 340px;
    animation: glowRotate 4s linear infinite reverse;
}

.confetti {
    position: fixed;
    pointer-events: none;
    z-index: 2500;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.08); }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }

.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(5px);
    animation: fadeIn 0.3s ease;
}

.modal.show {
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-content {
    position: relative;
    background: linear-gradient(135deg, rgba(30, 30, 60, 0.97), rgba(20, 20, 45, 0.97));
    border-radius: 25px;
    padding: 36px;
    max-width: 600px;
    width: 90%;
    max-height: 70vh;
    overflow-y: auto;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 20px 70px rgba(0, 0, 0, 0.4);
    animation: slideInUp 0.4s ease;
}

.modal-content h2 {
    font-size: 1.8em;
    margin-bottom: 20px;
    text-align: center;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
}

.modal-hint {
    font-size: 0.85em;
    opacity: 0.6;
    margin-bottom: 12px;
    text-align: center;
}

.import-hint-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
}

.import-dl-btn {
    font-size: 12px !important;
    padding: 8px 16px !important;
    background: linear-gradient(135deg, #43e97b, #38f9d7) !important;
    color: #333 !important;
}

.import-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 8px;
}

.import-buttons button {
    min-width: 100px;
}

.file-upload-label {
    display: inline-block;
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    background: linear-gradient(135deg, #43e97b, #38f9d7);
    color: #333;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: all 0.3s ease;
    border: none;
}

.file-upload-label:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
}

.file-upload-label input {
    display: none;
}

.record-item {
    background: rgba(255, 255, 255, 0.08);
    padding: 14px 18px;
    margin: 10px 0;
    border-radius: 12px;
    border-left: 4px solid #ffeb3b;
    display: flex;
    justify-content: space-between;
    align-items: center;
    animation: slideInLeft 0.4s ease;
    transition: all 0.3s ease;
}

.record-item:hover {
    background: rgba(255, 255, 255, 0.12);
    transform: translateX(5px);
}

.record-item .rank {
    font-weight: 900;
    font-size: 1.2em;
    color: #ffeb3b;
    width: 36px;
    text-align: center;
    flex-shrink: 0;
}

.record-item .winner-info {
    flex: 1;
    text-align: left;
    margin: 0 12px;
    min-width: 0;
}

.record-item .winner-name {
    font-weight: 700;
    font-size: 1em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.record-item .prize-name {
    font-size: 0.85em;
    opacity: 0.7;
    margin-top: 3px;
}

.record-item .time {
    font-size: 0.8em;
    opacity: 0.5;
    flex-shrink: 0;
}

.record-actions {
    text-align: center;
    margin-top: 16px;
}

.modal-close {
    position: absolute;
    right: 20px;
    top: 16px;
    font-size: 28px;
    cursor: pointer;
    opacity: 0.5;
    transition: all 0.3s ease;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
}

.modal-close:hover {
    opacity: 1;
    background: rgba(255, 255, 255, 0.2);
    transform: rotate(90deg);
}

.empty-record {
    text-align: center;
    padding: 30px 20px;
    opacity: 0.6;
    font-size: 1.1em;
}

@keyframes indicatorPulse {
    0%, 100% { opacity: 0.6; transform: translateY(-50%) translateX(0); }
    50% { opacity: 1; transform: translateY(-50%) translateX(-6px); }
}

.toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3000;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(10px);
    color: #fff;
    padding: 12px 28px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    border: 1px solid rgba(255, 255, 255, 0.08);
    white-space: nowrap;
}

.toast.show {
    opacity: 1;
}

.winner-overlay {
    display: none;
    position: fixed;
    z-index: 2000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    align-items: center;
    justify-content: flex-start;
    flex-direction: column;
    padding-top: 20px;
    overflow-y: auto;
}

.winner-overlay.show {
    display: flex;
}

.winner-close {
    position: absolute;
    right: 25px;
    top: 20px;
    font-size: 36px;
    cursor: pointer;
    opacity: 0.6;
    color: #fff;
    transition: all 0.3s ease;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    z-index: 10;
    line-height: 1;
}

.winner-close:hover {
    opacity: 1;
    background: rgba(255, 255, 255, 0.2);
    transform: rotate(90deg);
}

.winner-content {
    text-align: center;
    color: #fff;
    pointer-events: none;
    padding: 20px 20px 10px;
    max-width: 90vw;
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

.winner-label {
    font-size: 28px;
    margin-bottom: 12px;
    flex-shrink: 0;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    animation: scaleIn 0.5s ease forwards;
}

.winner-names {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    position: relative;
    margin: 8px 0;
}

.winner-scroll-wrap {
    will-change: transform;
}

.winner-prize-display {
    font-size: 24px;
    opacity: 0.9;
    padding: 4px 0 8px;
    flex-shrink: 0;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    animation: fadeInUp 0.6s ease 0.3s both;
}

.winner-label {
    font-size: 28px;
    margin-bottom: 16px;
    opacity: 0.9;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    animation: scaleIn 0.5s ease forwards;
}

.winner-names {
    margin: 10px 0;
    padding: 0 10px;
    width: 100%;
    height: 50vh;
    overflow: hidden;
    position: relative;
}

.winner-scroll-wrap {
    will-change: transform;
}

.winner-prize-display {
    font-size: 26px;
    opacity: 0.9;
    margin-top: 10px;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    animation: fadeInUp 0.6s ease 0.3s both;
}

.confirm-dialog {
    display: none;
    position: fixed;
    z-index: 4000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    align-items: center;
    justify-content: center;
}

.confirm-dialog.show {
    display: flex;
}

.confirm-content {
    background: linear-gradient(135deg, rgba(30, 30, 60, 0.97), rgba(20, 20, 45, 0.97));
    border-radius: 16px;
    padding: 30px 36px;
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    animation: slideInUp 0.3s ease;
}

.confirm-content p {
    margin-bottom: 20px;
    font-size: 16px;
    color: #fff;
    white-space: pre-line;
}

.confirm-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
}

.confirm-buttons button {
    min-width: 80px;
    padding: 10px 24px;
    margin: 0;
}

.confirm-buttons button:first-child {
    background: linear-gradient(135deg, #667eea, #764ba2);
}
</style>
</head>
<body>

<canvas id="particleCanvas"></canvas>
<div class="fullscreen-hint">按 F 全屏</div>

<h1>✨ 年会抽奖系统 ✨</h1>
<p class="subtitle">庆祝年会，赢取大奖</p>

<div id="display">
    <div id="displayGlow1"></div>
    <div id="displayGlow2"></div>
    <div id="displayBg"></div>
    <div id="currentPrize"></div>
    <div id="displayContent"></div>
</div>
<div id="winnerBoard"></div>

<div id="setupPanel">

<div class="prize-row">
<input id="prizeInput" placeholder="🎁 输入本轮奖品" onkeypress="if(event.key==='Enter') toggleDraw()" oninput="render()">
<div class="draw-count-wrap">
<label>人数</label>
<button class="draw-count-btn" onclick="adjustCount(-1)">−</button>
<input type="number" id="drawCount" value="1" min="1" onchange="validateDrawCount()">
<button class="draw-count-btn" onclick="adjustCount(1)">+</button>
</div>
</div>

<div id="nameBox">
<h3>👥 人员名单</h3>
<div class="name-input-row">
<input id="nameInput" placeholder="输入参与者姓名" onkeypress="if(event.key==='Enter') addName()">
<button onclick="addName()">+ 添加</button>
</div>
<div id="nameList"></div>
</div>

<div class="action-row">
<button onclick="undoDraw()" id="undoBtn" disabled style="background: linear-gradient(135deg, #f7b731, #f093fb);">↩ 撤销</button>
<button onclick="showImport()" style="background: linear-gradient(135deg, #4facfe, #00f2fe);">📥 导入</button>
<button onclick="showRecords()" style="background: linear-gradient(135deg, #f5576c, #f093fb);">📋 记录</button>
<button onclick="resetAll()" style="background: linear-gradient(135deg, #a8a8a8, #666);">🔄 重置</button>
</div>

</div>

<div class="button-group">
<button id="drawBtn" onclick="toggleDraw()">🎉 开始抽奖</button>
</div>

<div id="recordModal" class="modal">
<div class="modal-content">
<span class="modal-close" onclick="closeRecords()">&times;</span>
<h2>🏆 抽取记录</h2>
<div id="recordList"></div>
<div class="record-actions">
<button onclick="exportRecords()" style="background: linear-gradient(135deg, #43e97b, #38f9d7); color: #333;">📤 导出记录</button>
</div>
</div>
</div>

<div id="importModal" class="modal">
<div class="modal-content">
<span class="modal-close" onclick="closeImport()">&times;</span>
<h2>📥 批量导入名单</h2>
<p class="modal-hint">每行一个姓名，或用中文逗号 / 英文逗号 / 分号 / 空格分隔</p>
<textarea id="importText" placeholder="张三，李四，王五，赵六，陈七，周八"></textarea>
<div class="import-hint-row">
<label class="file-upload-label">
📁 选择文件
<input type="file" accept=".txt,.csv" onchange="handleImportFile(event)">
</label>
<button onclick="downloadTemplate()" class="import-dl-btn">📄 下载模板</button>
</div>
<div class="import-buttons">
<button onclick="submitImport()" style="background: linear-gradient(135deg, #667eea, #764ba2);">✅ 确认导入</button>
</div>
</div>
</div>

<div id="winnerOverlay" class="winner-overlay">
    <span class="winner-close" onclick="closeWinner()">&times;</span>
    <div class="winner-content">
        <div class="winner-label">🏆 恭喜中奖 🏆</div>
        <div class="winner-prize-display" id="winnerPrizeDisplay"></div>
        <div class="winner-names" id="winnerNames"></div>
    </div>
</div>

<div id="toast" class="toast"></div>

<div id="confirmDialog" class="confirm-dialog">
    <div class="confirm-content">
        <p id="confirmMsg"></p>
        <div class="confirm-buttons">
            <button onclick="confirmYes()">确定</button>
            <button onclick="confirmNo()">取消</button>
        </div>
    </div>
</div>

<script>
const STORAGE_KEY = 'lottery_data';

// ========== 数据状态 ==========
let initNames = [];
let names = [];
let records = [];
let currentPrizeName = "";

let running = false;
let stopping = false;
let currentWinner = "";

let scrollRaf = null;
let stopDelayTimer = null;
let confettiTimers = [];
let particleRaf = null;

let confirmCallback = null;
let confettiRunning = false;

let lastDraw = null;   // 上次抽奖结果（用于撤销）
let seqState = null;     // 多人顺序抽取状态
let autoStopTimer = null;

// ========== localStorage 持久化 ==========
function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            names, initNames, records,
            prizeInput: document.getElementById('prizeInput').value
        }));
    } catch(e) {}
}

function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (Array.isArray(data.names)) names = data.names;
        if (Array.isArray(data.initNames)) initNames = data.initNames;
        if (Array.isArray(data.records)) records = data.records;
        if (typeof data.prizeInput === 'string') document.getElementById('prizeInput').value = data.prizeInput;
    } catch(e) {}
}

// ========== 抽奖人数控件 ==========
function adjustCount(delta) {
const el = document.getElementById('drawCount');
let v = parseInt(el.value) || 1;
v = Math.max(1, Math.min(v + delta, names.length || 99));
el.value = v;
}

function validateDrawCount() {
const el = document.getElementById('drawCount');
let v = parseInt(el.value);
if(isNaN(v) || v < 1) { el.value = 1; showToast('人数不能少于 1'); return; }
const max = names.length || 99;
if(v > max) { showToast('⚠️ 人数不能超过总人数 ' + max); return; }
}

// ========== 确认弹窗 ==========
function showConfirm(msg, cb){
    document.getElementById("confirmMsg").textContent = msg;
    confirmCallback = cb;
    document.getElementById("confirmDialog").classList.add("show");
}

function confirmYes(){
    document.getElementById("confirmDialog").classList.remove("show");
    if(confirmCallback) confirmCallback();
    confirmCallback = null;
}

function confirmNo(){
    document.getElementById("confirmDialog").classList.remove("show");
    confirmCallback = null;
}

function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2000);
}

function closeWinner(){
    document.getElementById("winnerOverlay").classList.remove("show");
    document.body.classList.remove("drawing");
    clearConfetti();
}

function toggleDraw(){
if(running) stopDraw();
else startDraw();
}

// ========== 名单管理 ==========
function addName(){
let v = document.getElementById("nameInput").value.trim();
if(!v){
showToast("请输入参与者姓名");
return;
}
if(names.includes(v)){
showToast("该名字已添加");
return;
}
names.push(v);
if(!initNames.includes(v)) initNames.push(v);
document.getElementById("nameInput").value="";
document.getElementById("nameInput").focus();
render();
saveState();
updateUndoBtn();
}

function delName(i){
const name = names[i];
showConfirm(`确定要删除 ${name} 吗？`, () => {
let idx = initNames.indexOf(name);
if(idx!==-1) initNames.splice(idx,1);
names.splice(i,1);
render();
saveState();
updateUndoBtn();
});
}

function render(){
document.getElementById("nameList").innerHTML =
names.map((n,i)=>
`<div class="list-item">
<span>${i+1}. ${n}</span>
<span class="del" onclick="delName(${i})">✕</span>
</div>`
).join("");

if(running) return;
const dc = document.getElementById("displayContent");
if(dc.classList.contains("roll-mode")) return;
const prize = document.getElementById("prizeInput").value.trim();
if(names.length === 0 && !prize){
dc.innerHTML = '<span style="font-size:20px;opacity:0.35">添加参与者和奖品</span>';
} else {
let parts = [];
if(names.length) parts.push(`<span style="font-size:28px">👥 ${names.length} 人</span>`);
if(prize) parts.push(`<span style="font-size:18px;opacity:0.5">🎁 ${prize}</span>`);
dc.innerHTML = parts.join(' <span style="font-size:20px;opacity:0.3">|</span> ');
}
}

// ========== 彩带特效 ==========
function spawnConfettiPiece(){
const el = document.createElement("div");
el.className = "confetti";
el.style.left = Math.random() * window.innerWidth + "px";
el.style.top = "-10px";
const size = Math.random() * 8 + 4;
el.style.width = size + "px";
el.style.height = (Math.random() > 0.5 ? size : size * 0.6) + "px";
el.style.background = ["#f093fb","#f5576c","#667eea","#764ba2","#ffeb3b","#ffd700","#ff6b6b","#00d2d3"][Math.floor(Math.random() * 8)];
el.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
el.style.animation = `fall ${Math.random() * 3 + 2}s linear`;
document.body.appendChild(el);
setTimeout(() => el.remove(), 5000);
}

function createConfetti(){
confettiRunning = true;
confettiTimers = [];

function schedule(){
if(!confettiRunning) return;
for(let n = 0; n < 3; n++) spawnConfettiPiece();
const id = setTimeout(schedule, Math.random() * 120 + 60);
if(!confettiRunning) { clearTimeout(id); return; }
confettiTimers.push(id);
}

for(let i = 0; i < 60; i++){
const id = setTimeout(spawnConfettiPiece, i * 25);
confettiTimers.push(id);
}

confettiTimers.push(setTimeout(schedule, 600));
}

function clearConfetti(){
confettiRunning = false;
confettiTimers.forEach(id => clearTimeout(id));
confettiTimers = [];
document.querySelectorAll(".confetti").forEach(el => el.remove());
}

const fallStyle = document.createElement("style");
fallStyle.textContent = `@keyframes fall { to { transform: translateY(${window.innerHeight + 100}px) rotate(360deg); opacity: 0; } }`;
document.head.appendChild(fallStyle);

// Particle background
// ========== 粒子背景 ==========
function initParticles(){
const canvas = document.getElementById("particleCanvas");
const ctx = canvas.getContext("2d");
let w, h;

function resize(){
w = canvas.width = window.innerWidth;
h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const particles = [];
const count = 60;
for(let i = 0; i < count; i++){
particles.push({
x: Math.random() * w,
y: Math.random() * h,
r: Math.random() * 2 + 1,
dx: (Math.random() - 0.5) * 0.3,
dy: -(Math.random() * 0.2 + 0.1),
o: Math.random() * 0.4 + 0.1
});
}

function draw(){
ctx.clearRect(0, 0, w, h);
for(const p of particles){
p.x += p.dx;
p.y += p.dy;
if(p.x < 0) p.x = w;
if(p.x > w) p.x = 0;
if(p.y < -10) p.y = h + 10;
ctx.beginPath();
ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
ctx.fillStyle = `rgba(255,255,255,${p.o})`;
ctx.fill();
}
particleRaf = requestAnimationFrame(draw);
}
draw();
}
initParticles();

// ========== 开始抽奖 ==========
function startDraw(){

if(running) return;
const count = parseInt(document.getElementById('drawCount').value) || 1;
if(names.length===0){
showToast("请先添加参与者");
return;
}

currentPrizeName = document.getElementById("prizeInput").value.trim();
if(!currentPrizeName){
showToast("请输入奖品名称");
return;
}

const drawCount = count;
if(drawCount > names.length) {
showToast(`⚠️ 抽奖人数 ${drawCount} 超过总人数 ${names.length}`);
return;
}

if(scrollRaf) { cancelAnimationFrame(scrollRaf); scrollRaf = null; }
if(stopDelayTimer) { clearTimeout(stopDelayTimer); stopDelayTimer = null; }
if(autoStopTimer) { clearTimeout(autoStopTimer); autoStopTimer = null; }
document.getElementById("winnerOverlay").classList.remove("show");
clearConfetti();
running = true;
stopping = false;
currentWinner = "";

document.body.classList.add("drawing");

document.getElementById("drawBtn").disabled = false;
if(drawCount > 1){
document.getElementById("drawBtn").disabled = true;
document.getElementById("drawBtn").innerText = "⏳ 自动抽取中";
} else {
document.getElementById("drawBtn").innerText = "⏹ 停止";
}
document.getElementById("currentPrize").textContent = `🎁 ${currentPrizeName} × ${drawCount}人`;
document.getElementById("currentPrize").classList.add("show");

if(drawCount > 1){
seqState = { drawCount, selected: [], totalCount: drawCount };
startSingleDraw();
autoStopTimer = setTimeout(() => autoStop(), 2000 + Math.random() * 1500);
} else {
startSingleDraw();
}
}

// ========== 单人滚轮动画 ==========
function startSingleDraw(decel){

	const dc = document.getElementById("displayContent");
	// 打乱名单，确保公平
	const order = [...names];
	for(let i = order.length - 1; i > 0; i--){
	const j = Math.floor(Math.random() * (i + 1));
	[order[i], order[j]] = [order[j], order[i]];
	}
	let html = '<div class="roll-strip" id="rollStrip">';
	for(let r = 0; r < 15; r++){
	for(let i = 0; i < order.length; i++){
	html += `<div class="roll-item">${order[i]}</div>`;
	}
	}
html += '</div>';
dc.innerHTML = html;
dc.classList.add("roll-mode");

	const indicator = document.createElement("div");
	indicator.className = "roll-indicator";
	indicator.textContent = "◀";
	dc.appendChild(indicator);

	const strip = document.getElementById("rollStrip");
	const rollItems = strip.children;
	let offset = 0;
	const itemH = dc.querySelector('.roll-item').offsetHeight;
	const viewportH = dc.offsetHeight;
	const centerOffset = viewportH / 2;
	const setH = order.length * itemH;
	let speed = 36;
	const decelFactor = decel || 0.975;

// ========== 滚轮减速逻辑 ==========
function animate(){
if(!running) return;

if(names.length === 0) { reset(); return; }

offset += speed;
strip.style.transform = `translateY(-${offset}px)`;

if(setH > 0 && offset > setH * 14){
offset -= setH * 14;
strip.style.transform = `translateY(-${offset}px)`;
}

const centerIdx = (offset + centerOffset - itemH / 2) / itemH;
const firstV = Math.max(0, Math.floor(offset / itemH));
const lastV = Math.min(rollItems.length - 1, Math.ceil((offset + viewportH) / itemH));
for(let i = firstV; i <= lastV; i++){
const item = rollItems[i];
if(!item) continue;
const dist = Math.abs(i - centerIdx);
	const s = Math.max(0.4, 1.4 - dist * 0.4);
	const o = Math.max(0.2, 1 - dist * 0.3);
item.style.transform = `scale(${s})`;
item.style.opacity = o;
}

if(stopping){
speed *= decelFactor;
if(speed <= 0.1){
stopping = false;
const winIdx = Math.round((offset + centerOffset - itemH / 2) / itemH) % rollItems.length;
currentWinner = order[winIdx % order.length];
const winItem = rollItems[winIdx];
if(winItem){
winItem.style.transform = '';
winItem.style.opacity = '';
winItem.classList.add('roll-item-winner');
}
stopDelayTimer = setTimeout(() => finishDraw(), 600);
return;
}
}

scrollRaf = requestAnimationFrame(animate);
}

scrollRaf = requestAnimationFrame(animate);
}

// ========== 手动停止 / 自动停止 ==========
function stopDraw(){

if(!running || stopping) return;
stopping = true;
document.getElementById("drawBtn").disabled = true;
document.getElementById("drawBtn").innerText = seqState ? "⏳ 自动抽取中" : "⏹ 停…";
}

function autoStop(){
if(running && !stopping){
stopping = true;
document.getElementById("drawBtn").disabled = true;
document.getElementById("drawBtn").innerText = seqState ? "⏳ 自动抽取中" : "⏹ 停…";
}
}

// ========== 抽奖结果处理 ==========
function finishDraw(){

	running = false;
	stopping = false;
	if(stopDelayTimer) { clearTimeout(stopDelayTimer); stopDelayTimer = null; }

	const cp = document.getElementById("currentPrize");
	cp.classList.remove("show");
	cp.textContent = "";

	const ind = document.querySelector('.roll-indicator');
	if(ind) ind.remove();

const dc = document.getElementById("displayContent");
dc.classList.remove("roll-mode");
dc.innerHTML = "";

	document.getElementById("drawBtn").disabled = false;
	document.getElementById("drawBtn").innerText="🎉 开始抽奖";

	let anchor = currentWinner;
	if(!anchor) {
showToast("抽奖异常：未找到中奖者");
document.body.classList.remove("drawing"); reset(); return;
}

const drawCount = parseInt(document.getElementById('drawCount').value) || 1;

let nIndex = names.indexOf(anchor);
if(nIndex===-1){
showToast("抽奖异常：中奖者不在名单中");
document.body.classList.remove("drawing");
render();
return;
}

names.splice(nIndex, 1);

if(seqState) {

seqState.selected.push(anchor);

refreshWinnerBoard();

				if(seqState.selected.length < seqState.drawCount) {

document.getElementById("drawBtn").disabled = true;
document.getElementById("drawBtn").innerText = "⏳ 自动抽取中";

const currentPrize = document.getElementById("currentPrize");
currentPrize.textContent = `🎁 ${currentPrizeName} × ${seqState.drawCount}人（${seqState.selected.length}/${seqState.drawCount}）`;
currentPrize.classList.add("show");

stopDelayTimer = setTimeout(() => restartSequentialRoll(), 800);
return;

} else {

const allWinners = seqState.selected;
seqState = null;
showWinnersAndCelebrate(allWinners);
return;
}
}

records.push({
winners: [anchor],
prize: currentPrizeName,
time: new Date().toLocaleTimeString()
});

lastDraw = { winners: [anchor], prize: currentPrizeName, removedNames: [anchor], recordIndex: records.length - 1, recordCount: 1 };

document.getElementById("prizeInput").value = "";

showWinnerOverlay([anchor]);

render();
saveState();
updateUndoBtn();
}

// ========== 多人模式：自动续抽下一轮 ==========
function restartSequentialRoll() {

running = true;
stopping = false;
currentWinner = "";

const currentPrize = document.getElementById("currentPrize");
currentPrize.textContent = `🎁 ${currentPrizeName} × ${seqState.drawCount}人（${seqState.selected.length}/${seqState.drawCount}）`;
currentPrize.classList.add("show");

document.getElementById("drawBtn").disabled = true;
document.getElementById("drawBtn").innerText = "⏳ 自动抽取中";

startSingleDraw(0.96);
autoStopTimer = setTimeout(() => autoStop(), 1000 + Math.random() * 1500);
}

// ========== 更新左侧中奖名单面板 ==========
function refreshWinnerBoard() {
if(!seqState) return;
const names = seqState.selected;
const board = document.getElementById("winnerBoard");
if(!names.length) { board.classList.remove("show"); return; }
board.innerHTML = names.map((n, i) =>
`<div class="wb-row">${i + 1}. ${n}</div>`
).join('');
board.classList.add("show");
board.scrollTop = board.scrollHeight;
}

// ========== 多人抽取完毕：汇总展示 + 弹窗 ==========
function showWinnersAndCelebrate(winners) {

document.getElementById("winnerBoard").classList.remove("show");
document.getElementById("winnerBoard").innerHTML = "";

const recordStart = records.length;
records.push({
winners: [...winners],
prize: currentPrizeName,
time: new Date().toLocaleTimeString()
});

lastDraw = { winners: [...winners], prize: currentPrizeName, removedNames: [...winners], recordIndex: recordStart, recordCount: 1 };

document.getElementById("prizeInput").value = "";

showWinnerOverlay(winners);
render();
saveState();
updateUndoBtn();
}

// ========== 中奖弹窗（自动滚动员名单） ==========
function showWinnerOverlay(winners){
const total = winners.length;
const prize = document.getElementById("winnerPrizeDisplay");
const namesEl = document.getElementById("winnerNames");

const itemH = 28;
const one = w => `<div style="text-align:center;font-weight:700;color:#ffeb3b;text-shadow:0 0 10px rgba(255,215,0,0.4);font-size:${itemH}px;line-height:${itemH + 6}px">${w}</div>`;
const renderAll = arr => arr.map(w => one(w)).join('');

if(total === 1){
namesEl.innerHTML = `<div style="font-size:80px;font-weight:900;color:#ffeb3b;text-shadow:0 0 40px rgba(255,215,0,0.8)">${winners[0]}</div>`;
} else {
namesEl.innerHTML = `<div class="winner-scroll-wrap" data-count="${total}">${renderAll(winners)}${renderAll(winners)}</div>`;
}
prize.textContent = currentPrizeName ? `🎁 获得 ${currentPrizeName}` : '';

const overlay = document.getElementById("winnerOverlay");
overlay.classList.add("show");
createConfetti();

if(total > 1){
requestAnimationFrame(() => {
const wrap = namesEl.querySelector('.winner-scroll-wrap');
if(!wrap) return;
const halfH = wrap.offsetHeight / 2;
const containerH = namesEl.offsetHeight;
if(halfH <= containerH) {
const n = parseInt(wrap.dataset.count);
while(wrap.children.length > n) wrap.removeChild(wrap.lastChild);
return;
}
const dur = Math.max(3, Math.min(20, total * 0.12));
let pos = 0, lt = 0;
(function raf(t){
const now = t || performance.now();
if(!lt) lt = now;
const dt = (now - lt) / 1000;
lt = now;
pos += (halfH / dur) * dt;
if(pos >= halfH) pos = 0;
wrap.style.transform = `translateY(-${Math.round(pos)}px)`;
requestAnimationFrame(raf);
})(performance.now());
});
}
}

// ========== 撤销上一次抽奖 ==========
function undoDraw(){
if(!lastDraw || running) return;
showConfirm(`确定要撤销上一轮抽奖吗？\n（将恢复 ${lastDraw.winners.length} 位中奖者）`, () => {
const { removedNames, prize, recordIndex, recordCount = 1 } = lastDraw;
names.push(...removedNames);
records.splice(recordIndex, recordCount);
lastDraw = null;
document.getElementById("prizeInput").value = prize;
document.getElementById("winnerOverlay").classList.remove("show");
document.body.classList.remove("drawing");
clearConfetti();
render();
saveState();
updateUndoBtn();
showToast("已撤销");
});
}

// ========== 重置（恢复 initNames） ==========
function reset(){

if(scrollRaf) { cancelAnimationFrame(scrollRaf); scrollRaf = null; }
if(stopDelayTimer) { clearTimeout(stopDelayTimer); stopDelayTimer = null; }
if(autoStopTimer) { clearTimeout(autoStopTimer); autoStopTimer = null; }
	running = false;
	stopping = false;
	currentWinner = "";
	currentPrizeName = "";
	seqState = null;

	const cp = document.getElementById("currentPrize");
	cp.classList.remove("show");
	cp.textContent = "";

	document.getElementById("prizeInput").value = "";

	document.getElementById("drawBtn").disabled = false;
document.getElementById("drawBtn").innerText="🎉 开始抽奖";

	const dc = document.getElementById("displayContent");
	dc.classList.remove("roll-mode");
	dc.innerHTML = "";

	const ind = document.querySelector('.roll-indicator');
	if(ind) ind.remove();

	document.body.classList.remove("drawing");

document.getElementById("winnerOverlay").classList.remove("show");
clearConfetti();

names = [...initNames];
records = [];

render();
saveState();
updateUndoBtn();
}

// ========== 底部操作栏 ==========
function updateUndoBtn(){
const btn = document.getElementById("undoBtn");
if(lastDraw && !running){
btn.disabled = false;
} else {
btn.disabled = true;
}
}

// ========== 下载导入模板 ==========
function downloadTemplate(){
  const sample = ["张三","李四","王五","赵六","陈七","周八","吴九","郑十","孙十一","钱十二"];
  const blob = new Blob([sample.join('，')], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '名单模板.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

// ========== 批量导入 ==========
function showImport(){
  document.getElementById("importModal").classList.add("show");
  document.getElementById("importText").value = "";
  setTimeout(() => document.getElementById("importText").focus(), 200);
}

function closeImport(){
  document.getElementById("importModal").classList.remove("show");
}

function submitImport(){
  const text = document.getElementById("importText").value.trim();
  if(!text){ showToast("请输入或粘贴要导入的名单"); return; }

  const raw = text.split(/[\n,;，；、\s]+/).map(s => s.trim()).filter(Boolean);
  if(raw.length === 0){ showToast("未识别到有效的姓名"); return; }

  let added = 0, skipped = 0;
  for(const name of raw){
    if(names.includes(name)){ skipped++; continue; }
    names.push(name);
    if(!initNames.includes(name)) initNames.push(name);
    added++;
  }

  document.getElementById("importModal").classList.remove("show");
  if(added > 0) showToast(`✅ 成功导入 ${added} 人${skipped > 0 ? `，${skipped} 人重复已跳过` : ''}`);
  else showToast(`⚠️ 没有新姓名可导入${skipped > 0 ? `，${skipped} 人已存在` : ''}`);
  render();
  saveState();
  updateUndoBtn();
}

function handleImportFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    document.getElementById("importText").value = e.target.result;
  };
  reader.readAsText(file, 'UTF-8');
  event.target.value = '';
}

// ========== 重置所有（清空 localStorage） ==========
function resetAll(){
  showConfirm("确定要重置所有数据吗？\n（将清空名单、记录、奖品，不可恢复）", () => {
    localStorage.removeItem(STORAGE_KEY);
    if(scrollRaf) { cancelAnimationFrame(scrollRaf); scrollRaf = null; }
    if(stopDelayTimer) { clearTimeout(stopDelayTimer); stopDelayTimer = null; }
    if(autoStopTimer) { clearTimeout(autoStopTimer); autoStopTimer = null; }
    running = false;
    stopping = false;
    names = [];
    initNames = [];
    records = [];
    currentWinner = "";
    currentPrizeName = "";
    lastDraw = null;
    seqState = null;
document.getElementById("winnerBoard").classList.remove("show");
document.getElementById("winnerBoard").innerHTML = "";
    document.getElementById("prizeInput").value = "";
    const dc = document.getElementById("displayContent");
    dc.classList.remove("roll-mode");
    dc.innerHTML = "";
    const ind = document.querySelector('.roll-indicator');
    if(ind) ind.remove();
    const cp = document.getElementById("currentPrize");
    cp.classList.remove("show");
    cp.textContent = "";
    document.getElementById("winnerOverlay").classList.remove("show");
    document.body.classList.remove("drawing");
    clearConfetti();
    render();
    updateUndoBtn();
    showToast("已重置所有数据");
  });
}

// ========== 抽取记录 ==========
function showRecords(){
let modal = document.getElementById("recordModal");
let recordList = document.getElementById("recordList");

if(records.length === 0){
recordList.innerHTML = `<div class="empty-record">📭 暂无抽取记录</div>`;
}else{
recordList.innerHTML = records.map((r, i) => {
const w = r.winners || [];
const namesStr = w.length > 3
? w.slice(0, 3).join('、') + ` 等${w.length}人`
: w.join('、') || r.winner || '?';
return `
<div class="record-item">
<div class="rank">#${i+1}</div>
<div class="winner-info">
<div class="winner-name">🎊 ${namesStr}</div>
<div class="prize-name">🎁 ${r.prize}</div>
</div>
<div class="time">${r.time}</div>
</div>`;
}).join("");
}

modal.classList.add("show");
}

function closeRecords(){
let modal = document.getElementById("recordModal");
modal.classList.remove("show");
}

// ========== 导出记录 ==========
function exportRecords(){
  if(records.length === 0){ showToast("暂无记录可导出"); return; }
  let text = "序号\t奖品\t中奖者\t时间\n";
  records.forEach((r, i) => {
    const namesStr = r.winners ? r.winners.join('、') : r.winner || '?';
    text += `${i+1}\t${r.prize}\t${namesStr}\t${r.time}\n`;
  });
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `抽奖记录_${new Date().toISOString().slice(0,10)}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  showToast("记录已导出");
}

// ========== 点击外部关闭弹窗 ==========
window.onclick = function(event){
let recordModal = document.getElementById("recordModal");
if(event.target == recordModal) recordModal.classList.remove("show");
let importModal = document.getElementById("importModal");
if(event.target == importModal) importModal.classList.remove("show");
let winnerOv = document.getElementById("winnerOverlay");
if(event.target == winnerOv) closeWinner();
let confirmEl = document.getElementById("confirmDialog");
if(event.target == confirmEl) confirmNo();
}

// ========== 键盘快捷键 ==========
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    const modals = ["recordModal", "importModal"];
    for(const id of modals){
      const el = document.getElementById(id);
      if(el.classList.contains("show")){ el.classList.remove("show"); return; }
    }
    const winner = document.getElementById("winnerOverlay");
    if(winner.classList.contains("show")){ closeWinner(); return; }
    const confirmEl = document.getElementById("confirmDialog");
    if(confirmEl.classList.contains("show")){ confirmNo(); }
  }
  if(e.key === "f" || e.key === "F"){
    if(!document.fullscreenElement && document.documentElement.requestFullscreen){
      document.documentElement.requestFullscreen();
    }
  }
});

window.addEventListener("beforeunload", saveState);

loadState();
render();
updateUndoBtn();

</script>
